[challenge]
id = "scout-log-anomalies"
tier = "fast"
agent = "scout"
description = "Extract counted anomaly patterns from noisy service logs."
runs = 1
timeoutSeconds = 180

[prompt]
text = '''
You are scout. Process the log and return structured findings, not prose.

Return:
- Top anomaly patterns with counts
- Example request IDs
- Any queue/backpressure signal
- A short signal/noise summary

Log:
{{fixture:scout/app.log}}
'''

[verifier]
type = "structured-findings"
minScore = 0.75
requiredRegex = [
  "connection timeout",
  "3",
  "validation failed",
  "2",
  "upstream timeout",
  "payments",
  "lag_ms",
  "c1|c2|c3",
  "e1|e2"
]
forbiddenRegex = [
  "fix",
  "recommend implementing"
]
